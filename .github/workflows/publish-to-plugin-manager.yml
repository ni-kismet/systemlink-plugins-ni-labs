name: Publish to Plugin Manager

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin directory name or package name to publish (blank = all)
        required: false
        type: string
      release_tag:
        description: Existing release tag to submit without rebuilding a local plugin
        required: false
        type: string
      artifact_name:
        description: Optional .nipkg asset name when the release contains more than one
        required: false
        type: string
      source_commit:
        description: Optional 40-character commit SHA that produced the release artifact
        required: false
        type: string
  push:
    tags:
      - '*-v*.*.*'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - id: discover
        env:
          INPUT_PLUGIN: ${{ github.event.inputs.plugin || '' }}
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            MATRIX='[]'
            COUNT=0
          else
            MATRIX=$(node scripts/list-plugins.mjs)
            COUNT=$(node -e "const items = JSON.parse(process.argv[1]); process.stdout.write(String(items.length));" "$MATRIX")
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Discovered $COUNT plugin(s): $MATRIX"

  build-and-submit:
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    name: Publish ${{ matrix.package }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        working-directory: ${{ matrix.path }}
        run: npm run build

      - name: Test plugin
        working-directory: ${{ matrix.path }}
        run: npm run test --if-present -- --watch=false

      - name: Package plugin
        working-directory: ${{ matrix.path }}
        run: npm run package

      - name: Build thin submission manifest
        id: submission_manifest
        working-directory: ${{ matrix.path }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          MANIFEST_PATH=$(node ../../scripts/create-submission-manifest.mjs . --source-repo "${GITHUB_REPOSITORY}")
          echo "path=$MANIFEST_PATH" >> "$GITHUB_OUTPUT"

      - name: Locate artifacts
        id: artifacts
        working-directory: ${{ matrix.path }}
        run: |
          NIPKG_PATH=$(find dist/nipkg -maxdepth 1 -name '*.nipkg' | head -1)
          if [ -z "$NIPKG_PATH" ]; then
            echo 'No .nipkg artifact found' >&2
            exit 1
          fi
          echo "nipkg_path=$NIPKG_PATH" >> "$GITHUB_OUTPUT"
          echo "nipkg_name=$(basename "$NIPKG_PATH")" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ${{ matrix.path }}
        run: |
          if gh release view "${{ matrix.tag }}" >/dev/null 2>&1; then
            gh release upload "${{ matrix.tag }}" "${{ steps.artifacts.outputs.nipkg_path }}" --clobber
          else
            gh release create "${{ matrix.tag }}" \
              "${{ steps.artifacts.outputs.nipkg_path }}" \
              --title "${{ matrix.displayName }} v${{ matrix.version }}" \
              --notes "Release of ${{ matrix.displayName }} v${{ matrix.version }}" \
              --latest=false
          fi

          for icon in icon.svg icon.png; do
            if [ -f "$icon" ]; then
              gh release upload "${{ matrix.tag }}" "$icon" --clobber
            fi
          done

      - name: Submit to Plugin Manager
        env:
          PLUGIN_MANAGER_TOKEN: ${{ secrets.PLUGIN_MANAGER_DISPATCH_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ matrix.tag }}
          ARTIFACT_NAME: ${{ steps.artifacts.outputs.nipkg_name }}
        working-directory: ${{ matrix.path }}
        run: |
          MANIFEST=$(cat submission-manifest.json)

          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PLUGIN_MANAGER_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/ni-kismet/systemlink-plugin-manager/dispatches" \
            -d "$(jq -n \
              --arg event_type 'submit-app' \
              --argjson manifest "$MANIFEST" \
              --arg source_repo "$SOURCE_REPO" \
              --arg release_tag "$RELEASE_TAG" \
              --arg artifact_name "$ARTIFACT_NAME" \
              '{
                event_type: $event_type,
                client_payload: {
                  manifest: $manifest,
                  source_repo: $source_repo,
                  release_tag: $release_tag,
                  artifact_name: $artifact_name
                }
              }')"

          echo "Submitted ${{ matrix.package }} via repository_dispatch"

  submit-existing-release:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Submit existing release

    steps:
      - name: Resolve release artifact
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          REQUESTED_ARTIFACT: ${{ github.event.inputs.artifact_name || '' }}
        run: |
          set -euo pipefail

          RELEASE_JSON=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets)

          if [ -n "$REQUESTED_ARTIFACT" ]; then
            if ! jq -e --arg name "$REQUESTED_ARTIFACT" \
              '[.assets[] | select(.name == $name and (.name | endswith(".nipkg")))] | length == 1' \
              <<<"$RELEASE_JSON" >/dev/null; then
              echo "Requested artifact is not a .nipkg asset in release $RELEASE_TAG: $REQUESTED_ARTIFACT" >&2
              exit 1
            fi
            ARTIFACT_NAME="$REQUESTED_ARTIFACT"
          else
            ARTIFACT_COUNT=$(jq '[.assets[] | select(.name | endswith(".nipkg"))] | length' <<<"$RELEASE_JSON")
            if [ "$ARTIFACT_COUNT" -ne 1 ]; then
              echo "Release $RELEASE_TAG contains $ARTIFACT_COUNT .nipkg assets; provide artifact_name to select one." >&2
              exit 1
            fi
            ARTIFACT_NAME=$(jq -r '[.assets[] | select(.name | endswith(".nipkg")) | .name] | .[0]' <<<"$RELEASE_JSON")
          fi

          DOWNLOAD_DIR="$RUNNER_TEMP/plugin-manager-release"
          mkdir -p "$DOWNLOAD_DIR"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ARTIFACT_NAME" \
            --dir "$DOWNLOAD_DIR" \
            --clobber

          ARTIFACT_PATH="$DOWNLOAD_DIR/$ARTIFACT_NAME"
          if [ ! -f "$ARTIFACT_PATH" ]; then
            echo "Release asset was not downloaded: $ARTIFACT_NAME" >&2
            exit 1
          fi

          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$ARTIFACT_PATH" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Submit release to Plugin Manager
        env:
          PLUGIN_MANAGER_TOKEN: ${{ secrets.PLUGIN_MANAGER_DISPATCH_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          ARTIFACT_NAME: ${{ steps.release.outputs.artifact_name }}
          ARTIFACT_SHA256: ${{ steps.release.outputs.sha256 }}
          SOURCE_COMMIT: ${{ github.event.inputs.source_commit || '' }}
        run: |
          set -euo pipefail

          if [ -z "$PLUGIN_MANAGER_TOKEN" ]; then
            echo 'PLUGIN_MANAGER_DISPATCH_TOKEN is not configured.' >&2
            exit 1
          fi

          if [ -n "$SOURCE_COMMIT" ] && [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'source_commit must be a 40-character lowercase commit SHA.' >&2
            exit 1
          fi

          MANIFEST=$(jq -n \
            --arg nipkg_file "$ARTIFACT_NAME" \
            --arg sha256 "$ARTIFACT_SHA256" \
            --arg source_repo "$SOURCE_REPO" \
            --arg release_tag "$RELEASE_TAG" \
            --arg source_commit "$SOURCE_COMMIT" \
            '{
              schemaVersion: 2,
              nipkgFile: $nipkg_file,
              sha256: $sha256,
              sourceRepo: $source_repo,
              releaseTag: $release_tag
            } | if $source_commit == "" then . else . + {sourceCommit: $source_commit} end')

          curl -fsSL \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $PLUGIN_MANAGER_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/ni-kismet/systemlink-plugin-manager/dispatches' \
            -d "$(jq -n \
              --arg event_type 'submit-app' \
              --argjson manifest "$MANIFEST" \
              --arg source_repo "$SOURCE_REPO" \
              --arg release_tag "$RELEASE_TAG" \
              --arg artifact_name "$ARTIFACT_NAME" \
              '{
                event_type: $event_type,
                client_payload: {
                  manifest: $manifest,
                  source_repo: $source_repo,
                  release_tag: $release_tag,
                  artifact_name: $artifact_name
                }
              }')"

          echo "Submitted $ARTIFACT_NAME from release $RELEASE_TAG via repository_dispatch"

  nothing-to-publish:
    needs: discover
    if: needs.discover.outputs.count == '0' && github.event.inputs.release_tag == ''
    runs-on: ubuntu-latest
    steps:
      - run: echo 'No plugins matched the current workflow invocation.'
