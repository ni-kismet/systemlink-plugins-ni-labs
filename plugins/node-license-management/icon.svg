<?xml version="1.0" encoding="UTF-8"?>
<svg id="Node_License_Management" xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 512 512" role="img" aria-label="Node License Management">
  <defs>
    <linearGradient id="nlm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ad7c"/>
      <stop offset=".3" stop-color="#00855f"/>
      <stop offset=".77" stop-color="#014a35"/>
      <stop offset="1" stop-color="#023325"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="104" ry="104" fill="url(#nlm-bg)"/>

  <!-- license / certificate document -->
  <rect x="128" y="92" width="256" height="304" rx="24" ry="24" fill="#ffffff"/>
  <rect x="168" y="140" width="176" height="18" rx="9" fill="#32eb96"/>
  <rect x="168" y="182" width="176" height="18" rx="9" fill="#32eb96"/>
  <rect x="168" y="224" width="116" height="18" rx="9" fill="#32eb96"/>

  <!-- award seal with ribbon = the "license" mark -->
  <g>
    <polygon points="236,300 264,300 248,438 220,424" fill="#32eb96"/>
    <polygon points="248,300 276,300 292,424 264,438" fill="#32eb96"/>
    <circle cx="256" cy="328" r="58" fill="#32eb96"/>
    <polyline points="230,328 251,349 285,307" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
