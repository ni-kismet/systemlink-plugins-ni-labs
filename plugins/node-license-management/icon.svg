<?xml version="1.0" encoding="UTF-8"?>
<svg id="Node_License_Management" xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="nlm-bg" x1="40" y1="40" x2="472" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#47b85f"/>
      <stop offset=".5" stop-color="#2b8a48"/>
      <stop offset="1" stop-color="#145c30"/>
    </linearGradient>
    <style>
      .nlm-doc { fill: #fff; }
      .nlm-line { fill: #bfe3c8; }
      .nlm-ribbon { fill: #17663a; }
      .nlm-seal { fill: #7ccf8b; }
      .nlm-check { fill: none; stroke: #17663a; stroke-width: 13; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="100" ry="100" fill="url(#nlm-bg)"/>

  <!-- license / certificate document -->
  <rect class="nlm-doc" x="128" y="92" width="256" height="304" rx="24" ry="24"/>
  <rect class="nlm-line" x="168" y="140" width="176" height="18" rx="9"/>
  <rect class="nlm-line" x="168" y="182" width="176" height="18" rx="9"/>
  <rect class="nlm-line" x="168" y="224" width="116" height="18" rx="9"/>

  <!-- award seal with ribbon = the "license" mark -->
  <g>
    <polygon class="nlm-ribbon" points="236,300 264,300 248,438 220,424"/>
    <polygon class="nlm-ribbon" points="248,300 276,300 292,424 264,438"/>
    <rect class="nlm-seal" x="204" y="252" width="104" height="104" rx="14"/>
    <rect class="nlm-seal" x="204" y="252" width="104" height="104" rx="14" transform="rotate(45 256 304)"/>
    <circle class="nlm-doc" cx="256" cy="304" r="46"/>
    <polyline class="nlm-check" points="234,304 250,321 281,286"/>
  </g>
</svg>
